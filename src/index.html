<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Игра с гоблинами</title>
</head>
<body>
  <h1>Поймай гоблина!</h1>

  <div class="hud">
    <span>Попадания: <b id="score">0</b></span>
    <span>Промахи: <b id="misses">0 / 5</b></span>
  </div>

  <div id="game-board" class="board"></div>

  <div id="message" class="message"></div>
  <button id="restart" class="restart">Начать заново</button>
</body>
</html>
